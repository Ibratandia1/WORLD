<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>World · démo 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #bcd6ee; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; touch-action: none; }
    #hud { position: fixed; top: 10px; left: 10px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
    .pill { pointer-events: auto; background: rgba(255,255,255,.88); backdrop-filter: blur(6px); border-radius: 999px; padding: 7px 13px;
      font-size: 14px; font-weight: 600; color: #2b2f45; box-shadow: 0 2px 10px rgba(30,30,60,.15); border: 0; }
    button.pill { cursor: pointer; }
    #tag { position: fixed; bottom: 10px; left: 10px; font-size: 12px; color: #2b2f45; background: rgba(255,255,255,.75); padding: 5px 10px; border-radius: 8px; }
    #fps { position: fixed; top: 10px; right: 10px; }
  </style>
</head>
<body>
  <div id="hud">
    <span class="pill" id="clock">08:00</span>
    <button class="pill" id="speed">⏩ ×1</button>
    <button class="pill" id="night">🌙 Nuit</button>
    <a class="pill" href="./" style="text-decoration:none">← Jeu</a>
  </div>
  <span class="pill" id="fps">— img/s</span>
  <div id="tag">Démo 3D · glisser : se déplacer · clic droit / 2 doigts : tourner · molette / pincer : zoom</div>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
  <script type="module" src="src/demo3d.js"></script>
</body>
</html>
