<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#b8a6ec">
  <title>World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div id="game"></div>
  <div id="night"></div>

  <!-- En haut à gauche : l'essentiel (icônes sans texte) -->
  <div id="hud">
    <div class="pill"><span>⏰</span><b id="v-time">07:00</b><small id="v-day">J1</small></div>
    <div class="pill tap hidden" id="p-next" title="Prochain rendez-vous"><span id="v-nexti">📅</span><b id="v-next"></b></div>
    <div class="pill"><span id="v-weather">☀️</span></div>
    <div class="pill" id="p-money"><span>💶</span><b id="v-money">0</b></div>
    <div class="pill"><span>⚡</span><i class="bar"><i id="v-energy"></i></i></div>
    <div class="pill"><span>🍔</span><i class="bar"><i id="v-hunger"></i></i></div>
    <div class="pill"><span>😊</span><i class="bar"><i id="v-mood"></i></i></div>
  </div>

  <!-- Objectif en cours (premiers pas, puis rêves) -->
  <div id="quest" class="hidden"></div>
  <!-- Astuce du moment -->
  <div id="tip"></div>

  <!-- En haut à droite : le temps -->
  <div id="controls">
    <button id="b-pause">⏸</button>
    <button id="b-play" class="on">▶</button>
    <button id="b-fast">⏩</button>
    <button id="b-settings" title="Paramètres">⚙️</button>
    <button id="b-full">⛶</button>
  </div>

  <!-- Colonne de gauche : ma vie (frigo, travail, logement) + sortir / recentrer -->
  <div id="dock">
    <div class="pill" title="Repas au frigo"><span>🥫</span><b id="v-food">0</b></div>
    <div class="pill tap" id="p-job" title="Mon travail"><span>💼</span><b id="v-job">—</b><small id="v-warn" class="warn"></small></div>
    <div class="pill tap" id="p-home" title="Mon logement"><span id="v-homeic">🏠</span><b id="v-home">✓</b></div>
    <button id="b-exit" title="Sortir dans la rue">🚪</button>
    <button id="b-center" title="Recentrer sur moi">🎯</button>
  </div>

  <!-- Colonne de droite : outils (plan, habitants, routine, tenue, son) -->
  <div id="side">
    <button id="b-map" title="Plan des lieux">🗺️</button>
    <button id="b-people" title="Habitants">👥</button>
    <button id="b-routine" title="Routine automatique">🔁</button>
    <button id="b-look" title="Mon style">👕</button>
  </div>

  <!-- Étages (dans un immeuble) -->
  <div id="floors" class="hidden"></div>

  <!-- Écran d'accueil -->
  <div id="start" class="hidden"></div>
  <div id="skip">⏩</div>
  <div id="saved">💾</div>

  <!-- Fenêtre d'événements, en bas à droite -->
  <div id="box"></div>

  <!-- Paramètres : grande fenêtre paysage à onglets -->
  <div id="settings" class="hidden"></div>
  <!-- Bienvenue (première partie) -->
  <div id="welcome" class="hidden"></div>

  <!-- Création / personnalisation du personnage -->
  <div id="custom" class="hidden"></div>

  <div id="rotate"><div>📱↻</div><p>Tourne ton téléphone</p></div>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
